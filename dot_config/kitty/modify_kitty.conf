{{- /* chezmoi:modify-template */ -}}
background_opacity          0.6
cursor_trail                1
window_padding_width        0
font_size                   12
dynamic_background_opacity  yes

remember_window_size  no
initial_window_width  800
initial_window_height 500

{{- $in := .chezmoi.stdin -}}
{{- $f := regexFindAll `(?s)# BEGIN_KITTY_FONTS.*?# END_KITTY_FONTS` $in -1 -}}
{{- if $f }}
{{ index $f 0 }}
{{- else }}
# BEGIN_KITTY_FONTS
font_family      family="default"
# END_KITTY_FONTS
{{- end }}
{{- $t := regexFindAll `(?s)# BEGIN_KITTY_THEME.*?# END_KITTY_THEME` $in -1 -}}
{{- if $t }}
{{ index $t 0 }}
{{- else }}
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
{{- end }}
