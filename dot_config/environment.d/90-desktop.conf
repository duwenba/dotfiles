# 桌面会话环境变量（niri-session 使用 systemd user 会话）
# 与 ~/.config/niri/config.kdl 的 environment 块保持一致，
# 确保经 systemd 启动的应用（如 Noctalia 的 launch_apps_as_systemd_services）也拿到相同变量。
# 对应原 Hyprland 体系中的 ~/.config/uwsm/env

BROWSER=zen-browser
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=qt6ct
ELECTRON_OZONE_PLATFORM_HINT=auto
XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24

# fcitx5 中文输入法（Wayland 下不设置 GTK_IM_MODULE）
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
INPUT_METHOD=fcitx
