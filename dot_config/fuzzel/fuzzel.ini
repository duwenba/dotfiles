# ~/.config/fuzzel/fuzzel.ini
# 配色：Catppuccin Mocha（blue accent）
# https://github.com/catppuccin/fuzzel
include=~/.config/fuzzel/themes/catppuccin-mocha/blue.ini

font=MiSans:size=14
line-height=32
dpi-aware=no
terminal=kitty
icon-theme=breeze-dark
width=50
lines=10
horizontal-pad=16
vertical-pad=10
inner-pad=8
prompt="❯ "

[border]
width=2
radius=3
